name: Build & Push Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DEFAULT_DOCKERHUB_USER: "gandalf354"
  # Jika DOCKERHUB_USERNAME tidak diset sebagai secret, workflow tetap bisa BUILD (tanpa push)
  # ke nama default owner/genjaka agar mudah dicek tag/target image-nya.
  IMAGE_NAME: ${{ format('{0}/genjaka', (secrets.DOCKERHUB_USERNAME || env.DEFAULT_DOCKERHUB_USER)) }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Summarize Docker Hub config
        run: |
          echo "Target image name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          if [[ -n "${{ secrets.DOCKERHUB_USERNAME }}" && -n "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "Secrets DOCKERHUB_USERNAME & DOCKERHUB_TOKEN: TERSEDIA (push akan dijalankan)."
          else
            echo "::notice title=Docker Hub secrets belum di-set::Workflow ini HANYA build (tidak push) karena secrets DOCKERHUB_USERNAME dan/atau DOCKERHUB_TOKEN kosong. Buka https://github.com/${{ github.repository }}/settings/secrets/actions lalu tambahkan kedua secrets agar image di-push ke Docker Hub."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
